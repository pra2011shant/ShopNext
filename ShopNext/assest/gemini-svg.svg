<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <!-- Gradient for 'Next' and Icon accent -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <!-- Gradient for Royal Blue -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
  </defs>

  <!-- Background White -->
  <rect width="100%" height="100%" fill="#FFFFFF" rx="16" />

  <!-- ICON SECTION: S & N Fusion / Forward Arrow & Cart Concept -->
  <g transform="translate(25, 25)">
    <!-- Outer Shield / Container Rounded -->
    <rect x="0" y="0" width="110" height="110" rx="24" fill="url(#blueGrad)" shadow="..." />
    
    <!-- Stylized 'S' & 'N' Forward Arrow Shape -->
    <!-- S curve transitioning into N and forward arrow -->
    <path d="M 35 32 
             C 35 24, 75 24, 75 42 
             C 75 60, 35 60, 35 78 
             C 35 96, 75 96, 75 88" 
          fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
          
    <!-- Forward Arrow / Cart Motion Indicator -->
    <path d="M 65 72 L 88 88 L 65 104" 
          fill="none" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- TEXT SECTION: ShopNext -->
  <g transform="translate(155, 98)">
    <!-- 'Shop' in Deep Royal Blue -->
    <text x="0" y="0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="800" font-size="56" fill="#0C4A6E" letter-spacing="-1">Shop</text>
    
    <!-- 'Next' in Vibrant Orange Gradient -->
    <text x="135" y="0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="800" font-size="56" fill="url(#orangeGrad)" letter-spacing="-1">Next</text>
    
    <!-- Tagline -->
    <text x="2" y="30" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="4">FUTURE OF RETAIL</text>
  </g>
</svg>
